<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VaultKey</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 360px;
      height: 490px;
      background-color: #0B0F19;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Header */
    .header {
      padding: 14px 16px;
      background: #111827;
      border-bottom: 1px solid #1F2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: #F8FAFC;
    }
    .brand svg {
      width: 20px;
      height: 20px;
      fill: #10B981;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 9999px;
      background: #1F2937;
      color: #94A3B8;
      font-weight: 500;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
    }
    .status-dot.online { background: #10B981; }
    .status-dot.locked { background: #F59E0B; }

    /* Tabs */
    .tabs {
      display: flex;
      background: #111827;
      border-bottom: 1px solid #1F2937;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #94A3B8;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .tab-btn.active {
      color: #10B981;
      border-bottom-color: #10B981;
    }

    /* Content Area */
    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Current Site Header */
    .site-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: #1F2937;
      border-radius: 8px;
      font-size: 12px;
      color: #94A3B8;
    }
    .site-domain {
      font-weight: 600;
      color: #38BDF8;
    }

    /* Items List */
    .login-card {
      background: #111827;
      border: 1px solid #1F2937;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      transition: border-color 0.15s ease;
    }
    .login-card:hover {
      border-color: #10B981;
    }
    .login-title {
      font-size: 13px;
      font-weight: 600;
      color: #F8FAFC;
      margin-bottom: 2px;
    }
    .login-user {
      font-size: 12px;
      color: #94A3B8;
      margin-bottom: 10px;
      word-break: break-all;
    }
    .login-actions {
      display: flex;
      gap: 6px;
    }
    .btn-fill {
      flex: 1;
      background: #10B981;
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-fill:hover { background: #059669; }
    .btn-copy {
      background: #1F2937;
      color: #94A3B8;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-copy:hover { color: #F8FAFC; background: #374151; }

    /* Generator Tab */
    .gen-box {
      background: #111827;
      border: 1px solid #1F2937;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .gen-pass {
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      font-weight: 700;
      color: #10B981;
      word-break: break-all;
      user-select: text;
    }
    .slider-row {
      margin-bottom: 14px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #94A3B8;
      margin-bottom: 6px;
    }
    .slider-val {
      font-weight: 700;
      color: #10B981;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #10B981;
    }
    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .checkbox-label {
      font-size: 12px;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .checkbox-label input {
      accent-color: #10B981;
    }
    .btn-generate {
      width: 100%;
      padding: 10px;
      background: #10B981;
      border: none;
      border-radius: 8px;
      color: #FFFFFF;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-generate:hover { background: #059669; }

    /* Search Tab */
    .search-bar {
      width: 100%;
      background: #1F2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 8px 12px;
      color: #F8FAFC;
      font-size: 12px;
      outline: none;
      margin-bottom: 12px;
    }
    .search-bar:focus {
      border-color: #10B981;
    }

    /* Footer */
    .footer {
      padding: 10px 16px;
      background: #111827;
      border-top: 1px solid #1F2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #94A3B8;
    }
    .btn-lock {
      background: transparent;
      border: none;
      color: #EF4444;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-lock:hover { text-decoration: underline; }

    /* Empty states */
    .empty-state {
      text-align: center;
      padding: 40px 10px;
      color: #94A3B8;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
      <span>VaultKey</span>
    </div>
    <div class="status-badge">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Checking...</span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-logins">Logins</button>
    <button class="tab-btn" data-tab="tab-search">Search</button>
    <button class="tab-btn" data-tab="tab-generator">Generator</button>
  </div>

  <!-- 1. Logins Tab -->
  <div class="tab-content active" id="tab-logins">
    <div class="site-info">
      <span>Active Site:</span>
      <span class="site-domain" id="active-domain">...</span>
    </div>
    <div id="logins-list">
      <div class="empty-state">Loading credentials...</div>
    </div>
  </div>

  <!-- 2. Search Tab -->
  <div class="tab-content" id="tab-search">
    <input type="text" class="search-bar" id="search-input" placeholder="Search logins in vault..." />
    <div id="search-results">
      <div class="empty-state">Type a query to search vault.</div>
    </div>
  </div>

  <!-- 3. Generator Tab -->
  <div class="tab-content" id="tab-generator">
    <div class="gen-box">
      <span class="gen-pass" id="gen-pass-text">Generating...</span>
      <button class="btn-copy" id="btn-copy-gen">Copy</button>
    </div>

    <div class="slider-row">
      <div class="slider-header">
        <span>Password Length</span>
        <span class="slider-val" id="len-val">16</span>
      </div>
      <input type="range" id="len-slider" min="8" max="64" value="16" />
    </div>

    <div class="checkbox-grid">
      <label class="checkbox-label"><input type="checkbox" id="chk-upper" checked /> Uppercase (A-Z)</label>
      <label class="checkbox-label"><input type="checkbox" id="chk-lower" checked /> Lowercase (a-z)</label>
      <label class="checkbox-label"><input type="checkbox" id="chk-numbers" checked /> Numbers (0-9)</label>
      <label class="checkbox-label"><input type="checkbox" id="chk-symbols" checked /> Symbols (!@#$)</label>
    </div>

    <button class="btn-generate" id="btn-regen">Regenerate Password</button>
    <button class="btn-copy" style="width:100%;" id="btn-fill-gen">Fill into Active Page</button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span>VaultKey v1.0.0</span>
    <button class="btn-lock" id="btn-lock-vault">Lock Vault</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
